name: Publish release

# Tag-authorized, create-only release publication (PocketShell architecture):
#
#   authorize — runs ONLY from main; proves the requested v* tag exists and
#               points EXACTLY at the dispatched main HEAD, and that no
#               GitHub release for the tag exists yet. Emits the authorized
#               (tag, sha) pair.
#   build     — builds the debug APK and the signed release APK + AAB from
#               the authorized SHA, validates APK identity, version metadata
#               and the signing certificate, and uploads the artifacts.
#   publish   — the ONLY job with a write token. Re-verifies main, the tag
#               and release absence immediately before creating the GitHub
#               release with the artifacts from THIS run.
#
# Run it with:  gh workflow run publish-release.yml --ref main -f release_tag=vX.Y.Z
# See docs/RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag at the current main head"
        required: true
        type: string

concurrency:
  group: publish-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize tag at main head
    # Hard main-only gate: the dispatch must come from the default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.authorize.outputs.release_tag }}
      release_sha: ${{ steps.authorize.outputs.release_sha }}
    steps:
      - name: Checkout the dispatched main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Authorize the requested tag against the dispatched main HEAD
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 1. The tag must exist and point EXACTLY at the main commit this
          #    run was dispatched from (peel, so annotated tags also work).
          if ! tag_commit="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}")"; then
            echo "::error::tag ${RELEASE_TAG} does not exist in this repository" >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo "::error::tag ${RELEASE_TAG} points at ${tag_commit}, but the dispatched main HEAD is ${RELEASE_SHA}. Move main or the tag so they coincide, then re-run." >&2
            exit 1
          fi
          echo "tag ${RELEASE_TAG} resolves to the dispatched main HEAD ${RELEASE_SHA}"

          # 2. A GitHub release for this tag must not exist yet — publication
          #    is create-only. ONLY a clean 404 counts as "absent"; any other
          #    lookup error fails the job rather than masquerading as absence.
          if out="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" 2>&1)"; then
            echo "::error::a GitHub release for ${RELEASE_TAG} already exists — refusing to publish twice" >&2
            exit 1
          elif [[ "$out" != *"404"* && "$out" != *"Not Found"* ]]; then
            echo "::error::release lookup failed in an unexpected way (not a clean 404): ${out}" >&2
            exit 1
          fi
          echo "no existing GitHub release for ${RELEASE_TAG}"

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_sha=${RELEASE_SHA}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build, sign and validate release artifacts
    needs: authorize
    if: github.ref == 'refs/heads/main' && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
    steps:
      - name: Checkout the authorized release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0

      - name: Confirm the checked-out commit is the authorized tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          echo "building ${RELEASE_TAG} at ${RELEASE_SHA}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Derive version from the authorized tag
        id: version
        run: |
          set -euo pipefail
          scripts/derive-version.sh --self-test
          version_code="$(scripts/derive-version.sh version-code --ref "$RELEASE_TAG")"
          version_name="$(scripts/derive-version.sh version-name --ref "$RELEASE_TAG")"
          # Guard the contract: the name IS the tag, tag minus its leading v.
          test "$version_name" = "${RELEASE_TAG#v}" ||
            { echo "::error::derived versionName '${version_name}' does not match tag ${RELEASE_TAG}"; exit 1; }
          echo "versionCode=${version_code} versionName=${version_name}"
          {
            echo "code=${version_code}"
            echo "name=${version_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          # Opt-in telemetry endpoint; empty secrets keep the feature inert.
          OPENSCAN_TELEMETRY_UPLOAD_URL: ${{ secrets.OPENSCAN_TELEMETRY_UPLOAD_URL }}
          OPENSCAN_TELEMETRY_UPLOAD_TOKEN: ${{ secrets.OPENSCAN_TELEMETRY_UPLOAD_TOKEN }}

      - name: Verify debug APK version metadata
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          apk=app/build/outputs/apk/debug/app-debug.apk
          badging="$("$aapt2" dump badging "$apk")"
          got_code="$(printf '%s\n' "$badging" | grep -o "versionCode='[^']*'" | head -1 | cut -d"'" -f2)"
          got_name="$(printf '%s\n' "$badging" | grep -o "versionName='[^']*'" | head -1 | cut -d"'" -f2)"
          test -n "$got_code" || { echo "::error::no versionCode in aapt2 badging output"; exit 1; }
          test "$got_code" = "$VERSION_CODE" || { echo "::error::APK versionCode is ${got_code}, expected ${VERSION_CODE}"; exit 1; }
          test "$got_name" = "$VERSION_NAME" || { echo "::error::APK versionName is ${got_name}, expected ${VERSION_NAME}"; exit 1; }
          echo "debug APK metadata OK (versionCode=${got_code} versionName=${got_name})"
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}

      - name: Verify debug APK signature scheme
        run: scripts/check-apk-signing.sh --variant debug --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Rename debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/openscan-${{ steps.version.outputs.name }}-debug.apk"

      # Release signing activates in app/build.gradle.kts only when
      # ANDROID_RELEASE_KEYSTORE_BASE64 is present; publish always provides
      # the secrets, so a silent debug-signed fallback cannot ship.
      - name: Assemble signed release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --console=plain
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          # Opt-in telemetry endpoint; empty secrets keep the feature inert.
          OPENSCAN_TELEMETRY_UPLOAD_URL: ${{ secrets.OPENSCAN_TELEMETRY_UPLOAD_URL }}
          OPENSCAN_TELEMETRY_UPLOAD_TOKEN: ${{ secrets.OPENSCAN_TELEMETRY_UPLOAD_TOKEN }}

      - name: Verify release APK version metadata
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          apk=app/build/outputs/apk/release/app-release.apk
          badging="$("$aapt2" dump badging "$apk")"
          got_code="$(printf '%s\n' "$badging" | grep -o "versionCode='[^']*'" | head -1 | cut -d"'" -f2)"
          got_name="$(printf '%s\n' "$badging" | grep -o "versionName='[^']*'" | head -1 | cut -d"'" -f2)"
          test "$got_code" = "$VERSION_CODE" || { echo "::error::APK versionCode is ${got_code}, expected ${VERSION_CODE}"; exit 1; }
          test "$got_name" = "$VERSION_NAME" || { echo "::error::APK versionName is ${got_name}, expected ${VERSION_NAME}"; exit 1; }
          echo "release APK metadata OK (versionCode=${got_code} versionName=${got_name})"
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}

      # Asserts scheme v2+ AND that the signer certificate SHA-256 equals
      # ANDROID_RELEASE_CERT_SHA256 — a wrong keystore fails here, before
      # anything is published.
      - name: Verify release APK signing identity
        run: scripts/check-apk-signing.sh --variant release --apk app/build/outputs/apk/release/app-release.apk
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}

      - name: Rename release artifacts
        run: |
          set -euo pipefail
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/openscan-${{ steps.version.outputs.name }}-release.apk"
          mv app/build/outputs/bundle/release/app-release.aab \
            "app/build/outputs/bundle/release/openscan-${{ steps.version.outputs.name }}-release.aab"

      # upload-artifact keeps directory structure relative to the paths'
      # common ancestor — staging from three output directories would nest
      # apk/ and bundle/ subdirectories into the artifact and break the
      # publish job's flat glob. Copy everything into one flat directory.
      - name: Stage validated artifacts for the publish job
        run: |
          set -euo pipefail
          mkdir -p release-staging
          cp app/build/outputs/apk/debug/openscan-*-debug.apk release-staging/
          cp app/build/outputs/apk/release/openscan-*-release.apk release-staging/
          cp app/build/outputs/bundle/release/openscan-*-release.aab release-staging/
          test "$(find release-staging -maxdepth 1 -type f | wc -l)" -eq 3 ||
            { echo "::error::expected exactly 3 staged artifacts (debug APK, release APK, release AAB)"; exit 1; }

      - name: Upload validated artifacts for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: openscan-release-assets
          path: release-staging/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [authorize, build]
    if: github.ref == 'refs/heads/main' && needs.authorize.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only write-token job in the workflow.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
    steps:
      - name: Checkout the authorized release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Recheck immediately before the only write-token job publishes. This
      # catches main movement, tag replacement or a concurrent release that
      # happened while the APKs were being assembled (PocketShell-style race
      # protection). Queries go to the REMOTE, not the local checkout.
      - name: Reverify main, tag, and release absence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::main moved during the build (now ${main_sha:-<gone>}, authorized ${RELEASE_SHA}). Re-run the workflow from the new main head." >&2
            exit 1
          fi

          tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          peeled_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          tag_commit="${peeled_sha:-$tag_sha}"
          if [[ -z "$tag_commit" || "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo "::error::tag ${RELEASE_TAG} moved or was deleted during the build (now ${tag_commit:-<gone>}, authorized ${RELEASE_SHA})" >&2
            exit 1
          fi

          if out="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" 2>&1)"; then
            echo "::error::a GitHub release for ${RELEASE_TAG} already exists — refusing to publish twice" >&2
            exit 1
          elif [[ "$out" != *"404"* && "$out" != *"Not Found"* ]]; then
            echo "::error::release lookup failed in an unexpected way (not a clean 404): ${out}" >&2
            exit 1
          fi
          echo "race checks OK: main at ${RELEASE_SHA}, tag at ${RELEASE_SHA}, release still absent"

      - name: Download artifacts from this exact workflow run
        uses: actions/download-artifact@v7
        with:
          name: openscan-release-assets
          path: release-assets

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only regular files may reach gh release create — a directory in
          # the glob makes the asset upload fail after the release exists.
          test "$(find release-assets -type f | wc -l)" -eq 3 ||
            { echo "::error::expected exactly 3 downloaded artifacts (debug APK, release APK, release AAB)"; find release-assets; exit 1; }
          ls -l release-assets
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
          echo "published ${RELEASE_TAG} at ${RELEASE_SHA}"
